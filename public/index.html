<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Execution · Homeland FMS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F3A5F'/%3E%3Cpath d='M8 23V12l8-5 8 5v11' fill='none' stroke='%23B8863B' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f3f4f6; --surface: #ffffff; --border: #e3e6eb;
    --text: #0b0b0b; --text-2: #52514e; --muted: #7d7c77;
    --brand: #1F3A5F; --gold: #B8863B;
    --blue: #2a78d6; --good: #0ca30c; --good-text: #006300;
    --warn: #fab219; --warn-text: #8a5a00; --crit: #d03b3b; --crit-text: #b42828; --crit-bg: #fdecec;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  button, select { font: inherit; color: inherit; }

  header { background: var(--brand); color: #fff; padding: 16px 28px; display: flex; align-items: center; gap: 14px; border-bottom: 3px solid var(--gold); }
  header svg { width: 36px; height: 36px; flex: none; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; }
  header .sub { color: #d9c29a; font-size: 12px; }
  header .spacer { flex: 1; }
  header .meta { font-size: 12px; color: #c9d3e1; text-align: right; }
  .btn { border: 1px solid var(--border); background: var(--surface); padding: 7px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #f8f9fb; }
  header .btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.3); color: #fff; }
  header .btn:hover { background: rgba(255,255,255,.18); }
  .btn:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  main { max-width: 1280px; margin: 0 auto; padding: 24px 28px 40px; }
  #banner { display: none; margin-bottom: 18px; border: 1px solid var(--crit); background: var(--crit-bg); color: var(--crit-text); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; font-size: 13px; }

  .filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 14px; align-items: end; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 22px; }
  .filters label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .4px; min-width: 0; }
  .filters select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 14px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text); }
  .filters select:disabled { background: #f3f4f6; color: var(--muted); }
  .scope { font-size: 13px; color: var(--text-2); margin: -10px 0 16px 2px; }
  .scope b { color: var(--text); }

  .cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--accent); border-radius: 10px; padding: 18px 20px; }
  .card .label { font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 7px; }
  .card .icon { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; color: #fff; background: var(--accent); flex: none; }
  .card .value { font-size: 40px; font-weight: 700; line-height: 1.1; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .card .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .card .bar { height: 6px; background: #e9edf3; border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .card .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .c-total { --accent: var(--brand); }
  .c-done { --accent: var(--good); } .c-done .value { color: var(--good-text); }
  .c-pending { --accent: var(--warn); }
  .c-overdue { --accent: var(--crit); } .c-overdue .value { color: var(--crit-text); }
  .c-week { --accent: var(--blue); }

  footer { margin-top: 18px; font-size: 12px; color: var(--muted); }
  .loading { opacity: .55; transition: opacity .15s; }

  @media (max-width: 1100px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 800px) {
    .filters { grid-template-columns: 1fr 1fr; } .filters .btn { grid-column: 1 / -1; }
    .cards { grid-template-columns: 1fr 1fr; } main { padding: 16px; } header { padding: 14px 16px; }
  }
  @media (max-width: 460px) { .cards, .filters { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="rgba(255,255,255,.08)"/><path d="M8 23V12l8-5 8 5v11" fill="none" stroke="#B8863B" stroke-width="2.5"/><path d="M13 23v-6h6v6" fill="none" stroke="#fff" stroke-width="2"/></svg>
  <div>
    <h1>Work Execution</h1>
    <div class="sub">Homeland Group · FMS</div>
  </div>
  <div class="spacer"></div>
  <div class="meta" id="meta">Loading…</div>
  <button class="btn" id="btnRefresh" title="Fetch fresh data from the FMS">↻ Refresh</button>
</header>

<main id="app">
  <div id="banner" role="alert"></div>

  <section class="filters" aria-label="Filters">
    <label>Location<select id="fLocation"></select></label>
    <label>Tower<select id="fTower"></select></label>
    <label>Area<select id="fArea"></select></label>
    <label>Sub Area<select id="fSubArea"></select></label>
    <button class="btn" id="btnReset">Reset</button>
  </section>
  <div class="scope" id="scope"></div>

  <section class="cards" id="cards"></section>

  <footer>
    Pending = not yet completed · Overdue = pending and past its due date · Completed this week = completed since Monday.
    Inactive locations, towers, areas, sub-areas and tasks are excluded.
  </footer>
</main>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = n => n.toLocaleString('en-IN');
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const fmtDay = ms => new Date(ms).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });

const LEVELS = [
  { key: 'location', sel: '#fLocation', list: 'locations', all: 'All locations' },
  { key: 'tower', sel: '#fTower', list: 'towers', all: 'All towers' },
  { key: 'area', sel: '#fArea', list: 'areas', all: 'All areas' },
  { key: 'subArea', sel: '#fSubArea', list: 'subAreas', all: 'All sub areas' },
];
const F = { location: '', tower: '', area: '', subArea: '' };
let D = null;

async function load(force) {
  $('#app').classList.add('loading');
  try {
    const res = await fetch('api/data' + (force ? '?refresh=1' : ''));
    const body = await res.json().catch(() => ({ error: 'Invalid response from local server (HTTP ' + res.status + ')' }));
    if (!res.ok) throw body;
    D = prepare(body);
    $('#banner').style.display = 'none';
    // drop selections that no longer exist
    LEVELS.forEach(l => { if (F[l.key] && !D.byId[l.list].has(F[l.key])) F[l.key] = ''; });
    render();
    const g = new Date(body.generatedAt);
    $('#meta').innerHTML = 'Updated ' + esc(g.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })) + '<br>' + esc(g.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }));
  } catch (e) {
    const b = $('#banner');
    b.style.display = 'block';
    b.textContent = 'Could not load FMS data.\n\n' + (e.error || e.message || String(e)) + (e.detail ? '\n' + JSON.stringify(e.detail, null, 2) : '') + '\n\nCheck the PowerShell window running server.js for details.';
    $('#meta').textContent = 'Load failed';
  } finally {
    $('#app').classList.remove('loading');
  }
}

function prepare(d) {
  const live = arr => arr.filter(x => x.active);
  const lists = { locations: live(d.locations), towers: live(d.towers), areas: live(d.areas), subAreas: live(d.subAreas) };
  const byId = {};
  for (const k in lists) byId[k] = new Map(lists[k].map(x => [x.id, x]));
  // resolve each task to its full path; skip tasks under inactive/missing parents
  const tasks = [];
  for (const t of d.tasks) {
    if (!t.active) continue;
    const s = byId.subAreas.get(t.subAreaId), a = s && byId.areas.get(s.parent), tw = a && byId.towers.get(a.parent), l = tw && byId.locations.get(tw.parent);
    if (!l) continue;
    tasks.push({ ...t, subArea: s.id, area: a.id, tower: tw.id, location: l.id });
  }
  return { ...lists, byId, tasks };
}

// Option lists cascade: each level only shows children of the levels above it.
function optionsFor(i) {
  const l = LEVELS[i];
  let items = D[l.list];
  if (i === 0) return items;
  // nearest selected ancestor
  for (let j = i - 1; j >= 0; j--) {
    if (!F[LEVELS[j].key]) continue;
    const anc = F[LEVELS[j].key];
    const parentOf = (lvl, id) => D.byId[LEVELS[lvl].list].get(id)?.parent;
    return items.filter(x => { let id = x.id; for (let k = i; k > j; k--) id = parentOf(k, id); return id === anc; });
  }
  return items;
}

function fillFilters() {
  LEVELS.forEach((l, i) => {
    const sel = $(l.sel);
    const items = optionsFor(i);
    // show the parent name when the level above isn't chosen, so duplicate names stay clear
    const parentList = i > 0 ? LEVELS[i - 1].list : null;
    const label = x => (i > 0 && !F[LEVELS[i - 1].key] ? `${x.name} — ${D.byId[parentList].get(x.parent)?.name || ''}` : x.name);
    sel.innerHTML = `<option value="">${l.all}</option>` + items.map(x => `<option value="${esc(x.id)}"${x.id === F[l.key] ? ' selected' : ''}>${esc(label(x))}</option>`).join('');
  });
}

LEVELS.forEach((l, i) => {
  $(l.sel).addEventListener('change', e => {
    F[l.key] = e.target.value;
    // choosing a child fills in its parents; changing a parent clears children
    if (F[l.key]) {
      let id = F[l.key];
      for (let k = i; k > 0; k--) { id = D.byId[LEVELS[k].list].get(id).parent; F[LEVELS[k - 1].key] = id; }
    }
    for (let k = i + 1; k < LEVELS.length; k++) F[LEVELS[k].key] = '';
    render();
  });
});
$('#btnReset').onclick = () => { LEVELS.forEach(l => (F[l.key] = '')); render(); };
$('#btnRefresh').onclick = () => load(true);

function render() {
  if (!D) return;
  fillFilters();
  const tasks = D.tasks.filter(t => LEVELS.every(l => !F[l.key] || t[l.key] === F[l.key]));

  const now = new Date();
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const t0 = today.getTime(), m0 = monday.getTime();
  const dayOf = iso => { const d = new Date(iso); d.setHours(0, 0, 0, 0); return d.getTime(); };

  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const pending = total - done;
  const overdue = tasks.filter(t => !t.done && t.end && dayOf(t.end) < t0).length;
  const week = tasks.filter(t => t.done && t.doneAt && new Date(t.doneAt).getTime() >= m0).length;

  const card = (cls, icon, label, value, note, barPct) => `
    <div class="card ${cls}">
      <div class="label"><span class="icon" aria-hidden="true">${icon}</span>${label}</div>
      <div class="value">${fmtN(value)}</div>
      <div class="note">${note}</div>
      ${barPct == null ? '' : `<div class="bar"><i style="width:${barPct}%"></i></div>`}
    </div>`;
  $('#cards').innerHTML =
    card('c-total', '☰', 'Total Tasks', total, 'in current selection') +
    card('c-done', '✓', 'Completed', done, pct(done, total) + '% of total', pct(done, total)) +
    card('c-pending', '◷', 'Pending', pending, pct(pending, total) + '% of total', pct(pending, total)) +
    card('c-overdue', '!', 'Overdue', overdue, pct(overdue, pending) + '% of pending', pct(overdue, pending)) +
    card('c-week', '★', 'Completed This Week', week, 'since Mon ' + fmtDay(m0));

  const path = LEVELS.filter(l => F[l.key]).map(l => D.byId[l.list].get(F[l.key]).name);
  $('#scope').innerHTML = 'Showing: <b>' + esc(path.length ? path.join(' › ') : 'All locations') + '</b>';
}

load(false);
setInterval(() => load(false), 5 * 60 * 1000); // auto-refresh every 5 minutes
})();
</script>
</body>
</html>
