<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<title>Sign in · Homeland FMS</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  .form[hidden] { display: none; }
  html body.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(70% 55% at 50% 0%, rgba(179,135,80,.22), transparent 70%), linear-gradient(165deg, #1E2126 0%, #15171A 55%, #0D0E10 100%); }
  html body.auth main { width: min(400px, 100%); max-width: none; padding: 0; }
  .auth-card { width: 100%; background: #fff; border-radius: 8px; box-shadow: 0 24px 60px rgba(0,0,0,.35); overflow: hidden; }
  .auth-head { padding: 34px 32px 22px; text-align: center; border-bottom: 1px solid var(--rule-soft); }
  .auth-head img { width: 168px; height: auto; }
  .auth-head p { margin: 14px 0 0; font-size: 11px; font-weight: 500; letter-spacing: 3px; color: var(--accent); }
  .form { padding: 24px 32px 28px; display: flex; flex-direction: column; gap: 14px; }
  .form h1 { margin: 0; font-size: 19px; font-weight: 600; color: var(--ink); }
  .form .lead { margin: -6px 0 2px; font-size: 13.5px; color: var(--slate); }
  .form .btn.primary { justify-content: center; padding: 10px 14px; font-size: 14px; margin-top: 2px; }
  .auth-foot { margin: 18px 0 0; text-align: center; color: rgba(255,255,255,.6); font-size: 12px; }
</style>
</head>
<body class="auth">
<main>
  <div class="auth-card">
    <div class="auth-head">
      <img src="logo.png" alt="Homeland">
      <p>FIELD MANAGEMENT</p>
    </div>

    <form class="form" id="fLogin" hidden novalidate>
      <h1>Sign in</h1>
      <label>User ID<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-err" role="alert"></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>

    <form class="form" id="fSetup" hidden novalidate>
      <h1>Create the admin account</h1>
      <p class="lead">No accounts exist yet. This first account is the admin, who can then create user IDs for everyone else.</p>
      <label>Your name<input name="name" autocomplete="name" required></label>
      <label>User ID<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="e.g. vivek" required></label>
      <label>Password (at least 8 characters)<input name="password" type="password" autocomplete="new-password" required></label>
      <label>Repeat password<input name="confirm" type="password" autocomplete="new-password" required></label>
      <p class="form-err" role="alert"></p>
      <button class="btn primary" type="submit">Create admin account</button>
    </form>
  </div>
  <p class="auth-foot">Homeland Group · Work Execution and Dashboard</p>
</main>

<script>
(async () => {
  const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/dashboard.html'; return n.startsWith('/') && !n.startsWith('//') ? n : '/dashboard.html'; })();
  const post = async (url, body) => {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    return { ok: r.ok, data: await r.json().catch(() => ({})) };
  };
  let s = { setupNeeded: false };
  try { s = await (await fetch('/api/session', { cache: 'no-store' })).json(); } catch {}
  if (s.user) { location.replace(next); return; }
  const form = document.getElementById(s.setupNeeded ? 'fSetup' : 'fLogin');
  form.hidden = false;
  form.querySelector('input').focus();
  const err = form.querySelector('.form-err'), btn = form.querySelector('button');
  form.onsubmit = async e => {
    e.preventDefault();
    err.textContent = '';
    const v = Object.fromEntries(new FormData(form));
    if (s.setupNeeded && v.password !== v.confirm) { err.textContent = 'The passwords do not match.'; return; }
    btn.disabled = true;
    const r = await post(s.setupNeeded ? '/api/setup' : '/api/login', v).catch(() => ({ ok: false, data: { error: 'Cannot reach the server. Is it running?' } }));
    btn.disabled = false;
    if (r.ok) location.replace(next);
    else { err.textContent = r.data.error || 'Sign-in failed.'; if (!s.setupNeeded) form.password.select(); }
  };
})();
</script>
</body>
</html>
